<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小说翻译工作台</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <section class="brand">
          <div>
            <h1>小说翻译工作台</h1>
            <p>导入、分章、翻译记忆、术语一致性与导出。</p>
          </div>
          <span class="version">MVP</span>
        </section>

        <section class="panel">
          <h2>项目</h2>
          <label>
            书名
            <input id="projectTitle" type="text" value="未命名小说">
          </label>
          <div class="field-grid">
            <label>
              原文
              <input id="sourceLang" type="text" value="日文">
            </label>
            <label>
              译文
              <input id="targetLang" type="text" value="中文">
            </label>
          </div>
          <label>
            风格要求
            <textarea id="styleProfile" rows="5" placeholder="例如：轻小说口吻，保留敬语层级，人名不意译。"></textarea>
          </label>
        </section>

        <section class="panel">
          <h2>导入</h2>
          <label class="file-drop" for="fileInput">
            <input id="fileInput" type="file" accept=".txt,.epub,.md,text/plain,application/epub+zip">
            <span>选择 TXT / EPUB</span>
            <small>也可以把文件拖到页面中</small>
          </label>
          <label>
            从网址读取
            <input id="urlInput" type="url" placeholder="https://kakuyomu.jp/works/...">
          </label>
          <button id="fetchUrlBtn" class="secondary" type="button">尝试读取网页</button>
          <p id="importHint" class="hint">浏览器直连网站可能受 CORS 限制；Kakuyomu 抓取建议走后端代理。</p>
        </section>

        <section class="panel">
          <h2>导出</h2>
          <div class="button-grid">
            <button id="exportJsonBtn" type="button">JSON</button>
            <button id="exportTxtBtn" type="button">TXT</button>
            <button id="exportHtmlBtn" type="button">HTML</button>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div class="stats">
            <strong id="chapterCount">0</strong><span>章节</span>
            <strong id="segmentCount">0</strong><span>段落</span>
            <strong id="translatedCount">0</strong><span>已译</span>
          </div>
          <div class="toolbar-actions">
            <button id="buildPromptBtn" type="button">生成翻译提示词</button>
            <button id="runQaBtn" type="button" class="secondary">检查一致性</button>
          </div>
        </header>

        <section class="content-grid">
          <nav class="chapter-list" aria-label="章节列表">
            <div class="section-title">
              <h2>章节</h2>
              <button id="clearBtn" class="ghost" type="button">清空</button>
            </div>
            <div id="chapters"></div>
          </nav>

          <section class="segment-list">
            <div class="section-title">
              <h2>段落</h2>
              <span id="activeChapterTitle">未导入</span>
            </div>
            <div id="segments"></div>
          </section>

          <section class="editor">
            <div class="section-title">
              <h2>翻译编辑</h2>
              <span id="activeSegmentStatus">未选择</span>
            </div>
            <label>
              原文
              <textarea id="sourceText" rows="9" readonly></textarea>
            </label>
            <label>
              译文
              <textarea id="targetText" rows="9" placeholder="在这里输入或粘贴译文"></textarea>
            </label>
            <label>
              备注
              <textarea id="notesText" rows="3" placeholder="可记录译名、风格或问题"></textarea>
            </label>
            <div class="button-row">
              <button id="saveSegmentBtn" type="button">保存段落</button>
              <button id="copyPromptBtn" type="button" class="secondary">复制提示词</button>
            </div>
            <label>
              提示词预览
              <textarea id="promptOutput" rows="8" placeholder="点击生成翻译提示词"></textarea>
            </label>
          </section>
        </section>

        <section class="memory-grid">
          <article class="panel">
            <div class="section-title">
              <h2>术语表</h2>
              <button id="addGlossaryBtn" class="ghost" type="button">添加</button>
            </div>
            <div id="glossaryRows" class="table-list"></div>
          </article>
          <article class="panel">
            <div class="section-title">
              <h2>人物名表</h2>
              <button id="addEntityBtn" class="ghost" type="button">添加</button>
            </div>
            <div id="entityRows" class="table-list"></div>
          </article>
          <article class="panel">
            <div class="section-title">
              <h2>检查结果</h2>
              <span id="qaCount">0</span>
            </div>
            <div id="qaRows" class="qa-list"></div>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
